<!DOCTYPE html>
<html lang="zh-TW" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickLinker</title>
  <style>
    * { box-sizing: border-box; }
    html.theme-dark {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-2: #0f3460;
      --text: #f4f7fb;
      --muted: #b7c4d8;
      --border: rgba(255,255,255,0.12);
      --accent: #6c8cff;
      --accent-strong: #8ea4ff;
      --danger: #ff6b6b;
      --shadow: rgba(0,0,0,0.35);
    }
    html.theme-light {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef3ff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d8e0ee;
      --accent: #667eea;
      --accent-strong: #5167d5;
      --danger: #dc2626;
      --shadow: rgba(30,41,59,0.12);
    }
    body {
      width: 380px;
      min-height: 560px;
      max-height: 600px;
      margin: 0;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
    }
    button { font: inherit; }
    .popup-shell { position: relative; min-height: 560px; }
    .popup-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 10px var(--shadow);
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--accent);
    }
    #themeToggle {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }
    .popup-body { padding: 14px; display: grid; gap: 14px; }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 8px 22px var(--shadow);
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }
    #detectedCode {
      min-height: 42px;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
      word-break: break-word;
    }
    #optionsBtn, #ageConfirmBtn, #updateConfirmBtn {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .site-toggle-row, .recent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .site-toggle-row:last-child, .recent-row:last-child { border-bottom: 0; }
    .site-toggle-meta { min-width: 0; }
    .site-toggle-name { font-weight: 700; }
    .site-toggle-url {
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }
    .switch { position: relative; width: 42px; height: 24px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .switch span::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(18px); }
    .recent-row {
      border: 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .recent-row span { font-weight: 700; }
    .recent-row small { color: var(--muted); white-space: nowrap; }
    .empty-state { color: var(--muted); padding: 8px 0; }
    .popup-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 16px;
      border-top: 1px solid var(--border);
    }
    #optionsBtn { flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    #versionText { color: var(--muted); font-size: 12px; }
    #ageGate, #updateNotice {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 1;
      transition: opacity 300ms ease;
    }
    #updateNotice[hidden] { display: none; }
    .age-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.36);
      backdrop-filter: blur(6px);
    }
    .age-card {
      position: relative;
      width: 100%;
      padding: 18px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .age-card h2 { margin: 0 0 10px; font-size: 20px; }
    .age-card p { color: var(--muted); line-height: 1.55; margin: 0 0 14px; }
    .update-list {
      margin: 0 0 16px;
      padding-left: 18px;
      color: var(--text);
      line-height: 1.55;
    }
    .update-list li { margin: 7px 0; }
    .age-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0;
      line-height: 1.45;
    }
    .age-check input { margin-top: 3px; accent-color: var(--accent); }
    #ageConfirmBtn {
      margin-top: 12px;
      opacity: 0.4;
      pointer-events: none;
    }
    #ageConfirmBtn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    .age-note { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="popup-shell">
    <div id="ageGate">
      <div class="age-backdrop"></div>
      <div class="age-card">
        <h2 data-i18n="age_title"></h2>
        <p data-i18n="age_desc"></p>
        <label class="age-check">
          <input id="ageCheck1" type="checkbox">
          <span data-i18n="age_check1"></span>
        </label>
        <label class="age-check">
          <input id="ageCheck2" type="checkbox">
          <span data-i18n="age_check2"></span>
        </label>
        <button id="ageConfirmBtn" type="button" data-i18n="age_confirm"></button>
        <small class="age-note" data-i18n="age_version_note"></small>
      </div>
    </div>

    <div id="updateNotice" hidden>
      <div class="age-backdrop"></div>
      <div class="age-card update-card">
        <h2 data-i18n="update_title"></h2>
        <p id="updateVersionText"></p>
        <ul class="update-list">
          <li data-i18n="update_item_missav"></li>
          <li data-i18n="update_item_uncensored"></li>
          <li data-i18n="update_item_consistency"></li>
          <li data-i18n="update_item_options"></li>
        </ul>
        <button id="updateConfirmBtn" type="button" data-i18n="update_confirm"></button>
      </div>
    </div>

    <header class="popup-header">
      <div class="logo">
        <span class="logo-mark">QL</span>
        <span>QuickLinker</span>
      </div>
      <button id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <main class="popup-body">
      <section class="section detect-block">
        <h2 class="section-title" data-i18n="detected"></h2>
        <div id="detectedCode" data-i18n="no_code"></div>
      </section>

      <section class="section">
        <h2 class="section-title" data-i18n="sites"></h2>
        <div id="siteToggleList"></div>
      </section>

      <section id="recentSearchSection" class="section">
        <h2 class="section-title" data-i18n="recent"></h2>
        <div id="recentSearchList"></div>
      </section>
    </main>

    <footer class="popup-footer">
      <button id="optionsBtn" type="button" data-i18n="options"></button>
      <span id="versionText"></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
