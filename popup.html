<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>管理設定</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons/css/all/all.css">
  <style>
    body { font-family: Arial, sans-serif; width: 300px; padding: 10px; }
    .site { margin-bottom: 10px; }
    .tab { display: none; }
    .tab.active { display: block; }
    .tabs { display: flex; cursor: pointer; }
    .tabs div { padding: 10px; border: 1px solid #ccc; }
    .tabs .active { background-color: #f0f0f0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    .delete-btn, .update-btn { cursor: pointer; color: red; }
    .update-btn { color: blue; }
  </style>
</head>
<body>
  <h1>管理設定</h1>
  <div class="tabs">
    <div id="savedTab" class="active">已儲存的</div>
    <div id="addTab">新增的</div>
  </div>
  <div id="savedSites" class="tab active">
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Name</th>
          <th>URL</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="sitesContainer"></tbody>
    </table>
    <button id="exportSettings"><i class="fi fi-rr-inbox-out"></i></button>
    <input type="file" id="importSettings" style="display: none;">
    <button id="importButton"><i class="fi fi-rr-inbox-in"></i></button>
  </div>
  <div id="addSiteForm" class="tab">
    <label>網站名稱: <input type="text" id="newSiteName"></label><br>
    <label>URL: <input type="text" id="newSiteUrl"></label><br>
    <button id="addSite"><i class="fi fi-rr-disk"></i></button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
