<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>管理設定 </title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons/css/all/all.css">
  <style>
    body { font-family: Arial, sans-serif; width: 300px; padding: 10px; }
    .site { margin-bottom: 10px; }
    .tab { display: none; }
    .tab.active { display: block; }
    .tabs { display: flex; cursor: pointer; }
    .tabs div { padding: 10px; border: 1px solid #ccc; }
    .tabs .active { background-color: #f0f0f0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; }
    .delete-btn, .update-btn { cursor: pointer; color: red; }
    .update-btn { color: blue; }
  </style>
</head>
<body>
  <h1>QuickLinker 設定</h1>

  <div class="tabs">
    <div id="savedTab" class="tab-button active">網站管理</div>
    <div id="settingsTab" class="tab-button">掃描設定</div>
    <div id="addTab" class="tab-button">新增網站</div>
  </div>

  <div id="savedSites" class="tab-content active">
    <div id="sitesContainer" class="sortable-list">
      <!-- Sites will be rendered here by popup.js -->
    </div>
    <button id="exportSettings" title="匯出設定"><i class="fi fi-rr-inbox-out"></i> 匯出</button>
    <input type="file" id="importSettings" style="display: none;">
    <button id="importButton" title="匯入設定"><i class="fi fi-rr-inbox-in"></i> 匯入</button>
  </div>

  <div id="settingsContent" class="tab-content">
    <h2>掃描模式</h2>
    <div class="setting-item">
      <label>
        <input type="radio" name="scanMode" value="bestMatch" id="bestMatchMode"> 最佳結果模式 (找到第一個可用連結後停止)
      </label>
    </div>
    <div class="setting-item">
      <label>
        <input type="radio" name="scanMode" value="fullScan" id="fullScanMode"> 完整掃描模式 (掃描所有可用連結)
      </label>
    </div>
  </div>

  <div id="addSiteForm" class="tab-content">
    <h2>新增網站</h2>
    <div class="form-group">
      <label for="newSiteName">網站名稱:</label>
      <input type="text" id="newSiteName" placeholder="例如: JavDB">
    </div>
    <div class="form-group">
      <label for="newSiteBaseUrl">基礎 URL (使用 {} 作為番號佔位符):</label>
      <input type="text" id="newSiteBaseUrl" placeholder="例如: https://javdb.com/v/{}">
    </div>
    <button id="addSiteButton" class="action-button"><i class="fi fi-rr-disk"></i> 儲存網站</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
